name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-size:
    name: build + test + size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (release)
        run: cargo test --locked --release

      - name: Size budget trend
        run: ./scripts/size-gate.sh target/release/minfetch

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release

  reproducible-release:
    name: reproducible release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build identical release binaries
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1700000000
          export CARGO_INCREMENTAL=0
          cargo build --locked --release --target-dir target/repro-a
          cargo build --locked --release --target-dir target/repro-b
          sha256sum target/repro-a/release/minfetch target/repro-b/release/minfetch
          cmp target/repro-a/release/minfetch target/repro-b/release/minfetch
