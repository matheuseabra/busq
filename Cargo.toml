[package]
name = "minfetch"
version = "0.1.0"
edition = "2024"
description = "A tiny, pane-aware system-info readout for terminals"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matheuseabra/minfetch"
keywords = ["cli", "system-information", "terminal"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
