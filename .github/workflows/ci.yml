name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-size:
    name: build + test + size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release

      - name: Size budget trend
        run: ./scripts/size-gate.sh target/release/minfetch
