[package]
name = "busq"
version = "1.1.0"
edition = "2024"
description = "A tiny, pane-aware system-info readout for terminals"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matheuseabra/busq"
keywords = ["cli", "system-information", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "busq"
path = "src/main.rs"

[[bin]]
name = "minfetch"
path = "src/main.rs"

[features]
json = []
sysinfo = ["dep:sysinfo"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"], optional = true }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
