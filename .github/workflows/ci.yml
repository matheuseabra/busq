name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-size:
    name: build + test + size (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (release)
        run: cargo test --locked --release

      - name: Size budget trend
        run: ./scripts/size-gate.sh target/release/minfetch

  coverage:
    name: coverage (90% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Enforce line coverage
        run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90 --summary-only

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --release

  reproducible-release:
    name: reproducible release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build identical release binaries
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1700000000
          export CARGO_INCREMENTAL=0
          cargo build --locked --release --target-dir target/repro-a
          cargo build --locked --release --target-dir target/repro-b
          sha256sum target/repro-a/release/minfetch target/repro-b/release/minfetch
          cmp target/repro-a/release/minfetch target/repro-b/release/minfetch

  release-artifacts:
    name: release artifact (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build release target
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check artifact size
        run: ./scripts/size-gate.sh target/${{ matrix.target }}/release/minfetch

      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/release/minfetch" "minfetch-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: minfetch-${{ matrix.target }}
          path: minfetch-${{ matrix.target }}
          if-no-files-found: error
